[project]
name = "home-assistant-toulouse-metropole-dechets"
version = "0.1.1"
description = "Collectes des déchets de Toulouse Métropole pour Home Assistant"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
allowed-confusables = ["’"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
